# Raw data from MongoDB
traffic_raw:
  type: pandas.JSONDataset
  filepath: data/01_raw/traffic_raw.json
  # Ou utilisez un custom dataset MongoDB

# Parsed data
traffic_parsed:
  type: kedro_datasets.pandas.csv_dataset.CSVDataset
  filepath: data/02_intermediate/traffic_parsed.csv
  load_args:
    encoding: "utf-8-sig"
  save_args:
    index: false
    encoding: "utf-8-sig"

# --- Sortie finale persistée ---
traffic_cleaned:
  type: pandas.CSVDataset
  filepath: data/03_primary/traffic_cleaned.csv
  save_args:
    index: false
    encoding: "utf-8-sig"
