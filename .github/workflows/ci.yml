name: EcoTraffic CI/CD

on:
  push:
    branches: [main, Yasmine]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1 : Qualité du code ──────────────────────────────────────────────
  lint:
    name: Qualite du code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer flake8
        run: pip install flake8

      - name: Verifier la syntaxe Python
        run: flake8 app/ ml/ scripts/ --max-line-length=120 --ignore=E501,W503 --count

  # ── Job 2 : Tests unitaires ──────────────────────────────────────────────
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Installer les dependances
        run: |
          pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost pytest pymongo \
            mongomock python-dotenv sqlalchemy requests \
            kedro==1.1.1 "kedro-datasets[pandas]"

      - name: Lancer les tests
        run: pytest tests/ -v --tb=short

  # ── Job 3 : Build Docker (verification que l'image compile) ─────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image Airflow
        run: docker build -f airflow/Dockerfile -t ecotraffic-airflow:ci .
