stages:
  - build
  - test
  - deploy

variables:
  IMAGE_TAG: ecotraffic-airflow:$CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t $IMAGE_TAG -f airflow/Dockerfile .
    - docker save $IMAGE_TAG | gzip > image.tar.gz
  artifacts:
    paths:
      - image.tar.gz
    expire_in: 1 hour

test:
  stage: test
  image: python:3.11
  needs: [build]
  before_script:
    - python -m pip install --upgrade pip
    - pip install pandas numpy scikit-learn xgboost pytest pymongo mongomock
        python-dotenv sqlalchemy requests kedro==1.1.1 "kedro-datasets[pandas]"
    - pip install -e "ecotraffic[dev]"
  script:
    - pytest tests/ -v --tb=short

deploy:
  stage: deploy
  image: alpine:latest
  needs: [test]
  when: manual
  allow_failure: true
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client coreutils
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\n' | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$EC2_USER@$EC2_HOST" "
        cd ecotraffic &&
        git pull origin main &&
        docker compose -f docker-compose.merged.yml down &&
        docker compose -f docker-compose.merged.yml up -d --build
      "
