stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: python:3.11

  before_script:
    - python -m pip install --upgrade pip
    - pip install -e "ecotraffic[dev]"
    - pip install -r airflow/requirements.txt

  script:
    - cd ecotraffic
    - pytest tests

build:
  stage: build
  image: docker:latest

  services:
    - docker:dind

  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker build -t ecotraffic-airflow -f airflow/Dockerfile .

deploy:
  stage: deploy
  image: alpine:latest

  only:
    - main

  before_script:
    - apk add --no-cache openssh-client coreutils
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\n' | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

  script:
    - ssh "$EC2_USER@$EC2_HOST" "
        cd ecotraffic &&
        git pull origin main &&
        docker compose -f docker-compose.airflow.yml down &&
        docker compose -f docker-compose.airflow.yml up -d --build
      "
