services:
  airflow-webserver:
    image: apache/airflow:2.7.3-python3.10
    container_name: airflow-webserver
    restart: always
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW_HOME: /opt/airflow
      PYTHONPATH: /opt/airflow
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./app:/opt/airflow/app
      - ./.env:/opt/airflow/.env
      - ./requirements-airflow.txt:/requirements.txt
    ports:
      - "8080:8080"
    command: >
      bash -c "
      pip install --no-cache-dir -r /requirements.txt &&
      airflow db init &&
      airflow users create --username admin --password admin123 --firstname Eya --lastname Bensalem --role Admin --email eya@example.com || true &&
      exec airflow webserver --workers 1
      "

  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.10
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - airflow-webserver
      - postgres
      - mongo
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW_HOME: /opt/airflow
      PYTHONPATH: /opt/airflow
      MONGO_URI: mongodb://mongo:27017/ecotraffic
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/ecotraffic
      POSTGRES_TABLE_ENV: environment_features
      POSTGRES_TABLE_TRAFFIC: traffic_features
      SUPABASE_DB_URI: ${SUPABASE_DB_URI}
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./app:/opt/airflow/app
      - ./.env:/opt/airflow/.env
      - ./requirements-airflow.txt:/requirements.txt
      - ./kedro_preprocessing:/opt/airflow/kedro_preprocessing
      - ./ecotraffic:/opt/ecotraffic/ecotraffic
      - ./.env:/opt/ecotraffic/ecotraffic/.env
    command: >
      bash -c "
      pip install --no-cache-dir -r /requirements.txt &&
      sleep 10 &&
      exec airflow scheduler
      "

  postgres:
    image: postgres:15
    container_name: postgres-ecotraffic
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecotraffic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  airflow_home:
  postgres_data:
  grafana_data:
  mongo_data:
